<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jerry's Crap Shack™</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,sans-serif;background:#000}
*{box-sizing:border-box}
#locked{display:none;min-height:100vh;background:#000;align-items:center;justify-content:center}
#locked img{max-width:95vw;max-height:95vh;object-fit:contain;cursor:pointer}
#store{display:none;min-height:100vh;background:url("assets/StoreBackground.webp") center top/cover fixed no-repeat;overflow:hidden}
.stage{width:min(1100px,100%);min-height:100vh;margin:auto;position:relative;padding:20px 20px 70px}
.sign{display:block;width:min(650px,76vw);margin:0 auto 5px;filter:drop-shadow(5px 8px 4px #0008)}
.jerry{display:block;height:250px;max-width:40vw;object-fit:contain;margin:-18px auto -22px;filter:drop-shadow(4px 7px 4px #0008)}
.counter{background:#50351fdd;border:8px solid #2d1b10;box-shadow:0 10px 20px #0009;padding:16px;position:relative}
.counter:before{content:"JERRY'S QUALITY CRAP";display:block;text-align:center;color:#dfc38d;font-weight:bold;letter-spacing:3px;margin-bottom:12px}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:13px}
.item{min-height:190px;background:#d8c08d;border:4px solid #55391f;box-shadow:3px 4px #24170e;text-align:center;padding:8px;cursor:pointer;position:relative}
.item:hover{transform:translateY(-3px)}
.pic{height:125px;display:flex;align-items:center;justify-content:center;background:#e9dab8;border:2px inset #967b52;overflow:hidden}
.pic img{max-height:118px;max-width:100%;object-fit:contain}
.item b{font-size:13px;display:block;margin-top:7px}.item small{font-size:10px;color:#59462e}
.sold:after{content:"SOLD";position:absolute;left:5px;right:5px;top:63px;background:#fffbdcdd;color:#a00;border:5px solid #a00;font:900 34px Impact;transform:rotate(-14deg)}
.notice{display:none;position:fixed;right:15px;bottom:15px;padding:12px 15px;background:#111;color:#fff;border:2px solid #aaa;z-index:10}
.controls{text-align:center;margin-top:15px}.controls button{margin:4px;padding:8px 12px}
</style>
</head>
<body>
<div id="locked"><img src="assets/THE'RE_RUNNING_OUT_OF_YOU!.webp" alt="They're running out of you" onclick="history.back()"></div>
<div id="store">
 <div class="stage">
  <img class="sign" src="assets/Jerrys_Crap_Shack.webp" alt="Jerry's Crap Shack">
  <img class="jerry" src="assets/Jolly_Ol'_Jerry.webp" alt="Jerry">
  <div class="counter">
   <div class="items" id="items"></div>
  </div>
  <div class="controls"><button onclick="history.back()">BACK</button><button onclick="toggleEnding()">TEST ENDING A/B</button><button onclick="resetStore()">RESET PURCHASES</button></div>
 </div>
</div>
<div id="notice" class="notice"></div>
<audio id="music" src="assets/SMLWiki.com - jeffymart (Store Jerry's Crap-Shack).mp3" loop></audio>
<script>
const products=[
 ["Dog","Dog.webp","Store item"],
 ["Borat Jeffy Card Pack","Boratpack.webp","Booster pack"],
 ["Marvin Doll","Marvindoll04.webp","Dollthing"],
 ["Cvgart","Cvgart.webp","Store item"],
 ["File 11","File_11.webp","Store item"],
 ["Jerry's Crap Piano","Piano.webp","Ending C item"],
 ["House 01","House01.webp","House"],
 ["House 02","House02.webp","House"],
 ["House 03","House03.webp","House"],
 ["House 04","House04.webp","House"],
 ["House 05","House05.webp","House"]
];

const endingKeys=["endingA","endingB","endingab","EndingA","EndingB"];
const unlocked=endingKeys.some(k=>localStorage.getItem(k)==="true");
document.getElementById("locked").style.display=unlocked?"none":"flex";
document.getElementById("store").style.display=unlocked?"block":"none";

if(unlocked){
 const music=document.getElementById("music");
 const start=()=>{music.volume=.55;music.play().catch(()=>{});document.removeEventListener("click",start)};
 document.addEventListener("click",start);
}

const box=document.getElementById("items");
products.forEach((p,i)=>{
 const e=document.createElement("div");
 e.className="item"+(localStorage.getItem("itemSold"+i)==="true"?" sold":"");
 e.innerHTML=`<div class="pic"><img src="assets/${p[1]}" alt="${p[0]}"></div><b>${p[0]}</b><small>${p[2]}</small>`;
 e.onclick=()=>buy(e,i,p[0]);
 box.appendChild(e);
});

function buy(e,i,name){
 if(e.classList.contains("sold"))return;
 e.classList.add("sold");
 localStorage.setItem("itemSold"+i,"true");
 if(name==="Marvin Doll")localStorage.setItem("marvinDoll","true");
 if(name==="Jerry's Crap Piano")localStorage.setItem("crapPiano","true");
 toast(name+" purchased");
}
function toast(t){const n=document.getElementById("notice");n.textContent=t;n.style.display="block";setTimeout(()=>n.style.display="none",1600)}
function toggleEnding(){localStorage.setItem("endingA",localStorage.getItem("endingA")==="true"?"false":"true");location.reload()}
function resetStore(){if(confirm("Reset store purchases?")){Object.keys(localStorage).filter(k=>k.startsWith("itemSold")).forEach(k=>localStorage.removeItem(k));localStorage.removeItem("marvinDoll");localStorage.removeItem("crapPiano");location.reload()}}
</script>
</body>
</html>
