<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Brooklyn Guy's Night Shift - smlwiki.com</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:#eee;font-family:Arial,Helvetica,sans-serif}
body{overflow-x:hidden}
body:after{
  content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.10;
  background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(255,255,255,.025) 3px,transparent 4px)
}
#header-container{position:relative;z-index:20}
#page{min-height:100vh;padding:28px 12px 70px}
#title{
  width:min(640px,calc(100vw - 24px));margin:0 auto 5px;text-align:center;
  font:24px Georgia,"Times New Roman",serif;color:#eee;
  text-shadow:0 0 12px rgba(130,0,0,.25)
}
#subtitle{
  width:min(640px,calc(100vw - 24px));margin:0 auto 14px;text-align:center;
  color:#777;font-size:12px;letter-spacing:.12em;text-transform:uppercase
}
#shell{
  width:min(642px,calc(100vw - 24px));aspect-ratio:640/423;margin:auto;
  border:1px solid #252525;background:#000;position:relative;overflow:hidden;
  box-shadow:0 0 28px rgba(80,0,0,.15)
}
#game{
  position:absolute;left:0;top:0;width:640px;height:423px;transform-origin:top left;
  overflow:hidden;background:#000;image-rendering:pixelated
}
.screen{position:absolute;inset:0}
.hidden{display:none!important}

/* homemade title screen */
#start{
  background:url('https://ryan.destroygames.com/game/find-brooklyn-guy/game/960x0_1.jpg') center/cover no-repeat;
  overflow:hidden
}
#start:after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.15);pointer-events:none}
#startGuy{
  position:absolute;right:18px;bottom:-26px;z-index:2;width:260px;
  animation:dance 1200ms infinite ease-in-out
}
.bigwords,.littlewords,#speech{
  position:absolute;z-index:5;font-family:Arial,sans-serif;font-weight:900;color:#fff;
  text-shadow:1px -1px 1px #000,-1px 1px 1px #000,-1px -1px 1px #000,1px 1px 1px #000,
  0 2px 1px #000,0 -2px 1px #000,-2px 0 1px #000,2px 0 1px #000
}
.bigwords{left:53px;top:52px;font-size:32px;line-height:30px;transform:rotate(-3deg)}
.littlewords{left:41px;top:143px;font-size:15px;line-height:18px;transform:rotate(2deg)}
#speech{right:37px;top:30px;color:#e00;font-size:25px;transform:rotate(6deg)}
#speech:before{
  content:"";position:absolute;z-index:-1;left:-18px;top:-13px;width:190px;height:77px;
  background:#fff;border:3px solid #000;border-radius:50%
}
#speech:after{
  content:"";position:absolute;z-index:-1;right:6px;bottom:-29px;border:16px solid transparent;border-top-color:#fff;
  transform:rotate(-18deg)
}
#play{
  position:absolute;left:28px;bottom:27px;z-index:7;width:208px;height:59px;
  background:#ddd;border:4px solid #111;color:#111;font-size:28px;font-weight:900;
  transform:rotate(-2deg);cursor:pointer;
  box-shadow:inset 0 0 0 2px #888
}
#play:hover{filter:brightness(1.2);transform:rotate(1deg) scale(1.02)}
#tiny{position:absolute;left:29px;bottom:9px;z-index:6;font-size:9px;color:rgba(255,255,255,.6)}

/* in-game */
#shift{background:#050505}
#view{
  position:absolute;inset:0;background:#111 center/cover no-repeat;
  filter:brightness(.55) contrast(1.15);transition:filter .12s
}
#view:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 90px 28px rgba(0,0,0,.78)
}
#sceneGuy{
  position:absolute;z-index:4;display:none;width:130px;filter:brightness(.70) contrast(1.2)
}
#hudText{
  position:absolute;right:12px;top:7px;z-index:20;text-align:right;
  font-weight:900;font-size:18px;color:#fff;
  text-shadow:1px -1px 1px #000,-1px 1px 1px #000,-1px -1px 1px #000,1px 1px 1px #000
}
#power{font-size:13px;margin-top:2px}
#location{
  position:absolute;left:11px;top:8px;z-index:20;font-weight:900;font-size:15px;color:#fff;
  text-shadow:1px 1px 2px #000
}
#notice{
  position:absolute;left:12px;bottom:9px;z-index:40;
  color:rgba(255,255,255,.62);font:italic 11px Georgia,serif;opacity:0;transition:opacity .2s
}
#notice.show{opacity:1}

/* deliberately crude controls, like a little web game */
#leftZone,#rightZone{
  position:absolute;top:0;bottom:0;width:110px;z-index:12
}
#leftZone{left:0} #rightZone{right:0}
#panel{
  position:absolute;left:50%;bottom:7px;transform:translateX(-50%);z-index:30;
  width:355px;height:38px;display:flex;gap:4px;align-items:center;justify-content:center;
  background:rgba(0,0,0,.76);border:1px solid #555;padding:4px
}
.control{
  height:28px;background:#171717;border:1px solid #777;color:#ddd;font-size:10px;font-weight:900;
  padding:0 8px;cursor:pointer
}
.control:hover{background:#292929}
.control.on{background:#640000;color:#fff}
#cams{width:82px}
#camOverlay{position:absolute;inset:0;z-index:25;display:none;background:#050505}
#camOverlay.open{display:block}
#camPic{
  position:absolute;inset:0;background:center/cover no-repeat;
  filter:brightness(.45) contrast(1.35) grayscale(.35)
}
#camPic:after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle,transparent 22%,rgba(0,0,0,.78) 100%)
}
#camGuy{display:none;position:absolute;z-index:3;width:130px;bottom:20px;left:45%;filter:brightness(.72)}
#camGuy.show{display:block}
#camName{
  position:absolute;left:12px;top:10px;z-index:7;color:#fff;font-weight:900;font-size:16px;
  text-shadow:1px 1px #000
}
#map{
  position:absolute;right:12px;bottom:49px;z-index:8;width:191px;height:104px
}
.cam{
  position:absolute;width:54px;height:31px;background:#202020;color:#ddd;border:1px solid #aaa;
  font-size:9px;font-weight:900;cursor:pointer
}
.cam.active{background:#6d7754;color:#fff}
.c0{left:66px;top:0}.c1{left:3px;top:35px}.c2{left:129px;top:35px}.c3{left:66px;top:35px}.c4{left:34px;top:70px}.c5{left:100px;top:70px}
#officeBox{
  position:absolute;right:78px;bottom:9px;z-index:7;border:1px solid #aaa;background:#111;color:#ddd;
  padding:2px 7px;font-size:8px;font-weight:bold
}
#blackFlash{
  position:absolute;inset:0;z-index:90;background:#000;opacity:0;pointer-events:none
}
#whiteFlash{
  position:absolute;inset:0;z-index:91;background:#fff;opacity:0;pointer-events:none
}
#static{
  position:absolute;inset:0;z-index:50;pointer-events:none;opacity:.055;
  background:repeating-linear-gradient(0deg,transparent 0 2px,#fff 3px,transparent 4px)
}
#jumpscare{position:absolute;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}
#jumpscare.show{display:flex;animation:shake .065s steps(2,end) infinite}
#jumpscare img{width:390px;transform:scale(1.3);filter:contrast(1.5) brightness(.72)}
#ending{
  position:absolute;inset:0;z-index:120;background:#000;display:none;color:#fff;text-align:center;
  align-items:center;justify-content:center;flex-direction:column
}
#ending.show{display:flex}
#ending h2{font-size:42px;margin:0 0 8px}
#ending p{color:#777;font:italic 13px Georgia,serif}
#retry{margin-top:14px;background:#111;border:1px solid #666;color:#ddd;padding:7px 18px;cursor:pointer}

@keyframes dance{
  0%{transform:translateY(0) rotate(-3deg) scale(1.05)}
  50%{transform:translateY(12px) rotate(0)}
  100%{transform:translateY(0) rotate(-3deg) scale(1.05)}
}
@keyframes shake{
  0%{transform:translate(-6px,4px)}
  50%{transform:translate(7px,-5px)}
}
.glitch{animation:glitch 120ms steps(2,end)}
@keyframes glitch{
  0%{transform:translate(0)}
  25%{transform:translate(-2px,1px);filter:contrast(1.3)}
  50%{transform:translate(2px,-1px);filter:brightness(.7)}
  100%{transform:translate(0)}
}
#status{
  width:min(640px,calc(100vw - 24px));min-height:30px;margin:10px auto 0;text-align:center;
  color:#666;font:italic 13px Georgia,serif;opacity:0;transition:opacity .3s
}
#status.show{opacity:1}
</style>
</head>
<body>
<div id="header-container"></div>
<main id="page">
  <div id="title">Brooklyn Guy's Night Shift</div>
  <div id="subtitle">it's just another job.</div>

  <div id="shell">
    <div id="game">
      <div id="start" class="screen">
        <div class="bigwords">BROOKLYN GUY'S<br>NIGHT SHIFT!</div>
        <div class="littlewords">By whoever keeps<br>giving him jobs</div>
        <div id="speech">easy money!</div>
        <img id="startGuy" src="https://ryan.destroygames.com/game/find-brooklyn-guy/game/base_2.png" alt="">
        <button id="play">PLAY!</button>
        <span id="tiny">click to clock in</span>
      </div>

      <div id="shift" class="screen hidden">
        <div id="view"></div>
        <img id="sceneGuy" src="https://ryan.destroygames.com/game/find-brooklyn-guy/game/brooklyn.png" alt="">
        <div id="leftZone"></div><div id="rightZone"></div>
        <div id="location">OFFICE</div>
        <div id="hudText"><div id="clock">12 AM</div><div id="power">POWER: 100%</div></div>
        <div id="notice"></div>

        <div id="camOverlay">
          <div id="camPic"></div>
          <img id="camGuy" src="https://ryan.destroygames.com/game/find-brooklyn-guy/game/brooklyn.png" alt="">
          <div id="camName">CAM 1</div>
          <div id="map">
            <button class="cam c0 active" data-cam="0">CAM 1</button>
            <button class="cam c1" data-cam="1">CAM 2</button>
            <button class="cam c2" data-cam="2">CAM 3</button>
            <button class="cam c3" data-cam="3">CAM 4</button>
            <button class="cam c4" data-cam="4">CAM 5</button>
            <button class="cam c5" data-cam="5">CAM 6</button>
            <div id="officeBox">YOU</div>
          </div>
        </div>

        <div id="panel">
          <button class="control" id="leftDoor">LEFT DOOR</button>
          <button class="control" id="leftLight">LIGHT</button>
          <button class="control" id="cams">CAMERAS</button>
          <button class="control" id="rightLight">LIGHT</button>
          <button class="control" id="rightDoor">RIGHT DOOR</button>
        </div>

        <div id="static"></div>
        <div id="blackFlash"></div>
        <div id="whiteFlash"></div>

        <div id="jumpscare">
          <img src="https://ryan.destroygames.com/game/find-brooklyn-guy/game/base_2.png" alt="">
        </div>

        <div id="ending">
          <h2 id="endTitle">6 AM</h2>
          <p id="endText">nice.</p>
          <button id="retry">again</button>
        </div>
      </div>
    </div>
  </div>
  <div id="status"></div>
</main>

<audio id="amb" src="https://ryan.destroygames.com/game/find-brooklyn-guy/game/guy2.ogg" loop preload="auto"></audio>
<audio id="winSound" src="https://ryan.destroygames.com/game/find-brooklyn-guy/game/awshucks.mp3" preload="auto"></audio>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const shell=$('#shell'),game=$('#game'),start=$('#start'),shift=$('#shift'),status=$('#status');
function fit(){const w=shell.clientWidth;game.style.transform=`scale(${w/640})`;shell.style.height=(423*w/640)+'px'}
addEventListener('resize',fit);fit();

const bg1='https://ryan.destroygames.com/game/find-brooklyn-guy/game/levels/1bg.png';
const fg1='https://ryan.destroygames.com/game/find-brooklyn-guy/game/levels/1fg.png';
const bg3='https://ryan.destroygames.com/game/find-brooklyn-guy/game/levels/3.jpg';
const CAMS=[
 {n:'CAM 1 - FRONT ROOM',b:bg1},{n:'CAM 2 - FRONT HALL',b:fg1},
 {n:'CAM 3 - BACK ROOM',b:bg3},{n:'CAM 4 - STORAGE',b:bg1},
 {n:'CAM 5 - LEFT HALL',b:bg3},{n:'CAM 6 - RIGHT HALL',b:fg1}
];

let running=false,t=0,power=100,last=0,camOpen=false,cam=0;
let leftDoor=false,rightDoor=false,leftLight=false,rightLight=false;
let guy=0,moveTimer=0,doorTimer=0,look=0,blackout=false;
const duration=185;
const amb=$('#amb'),winSound=$('#winSound');

function note(text,ms=1400){
  const n=$('#notice');n.textContent=text;n.classList.add('show');
  setTimeout(()=>n.classList.remove('show'),ms);
}
function outerNote(text){
  status.textContent=text;status.classList.add('show');
  setTimeout(()=>status.classList.remove('show'),2200);
}
function tinyGlitch(){
  game.classList.remove('glitch');void game.offsetWidth;game.classList.add('glitch');
  setTimeout(()=>game.classList.remove('glitch'),130);
}
function flash(which='#whiteFlash',amount=.18){
  const e=$(which);e.style.opacity=amount;setTimeout(()=>e.style.opacity=0,85)
}
function renderOffice(){
  const v=$('#view');
  const side=look<-.2?'left':look>.2?'right':'center';
  if(side==='center'){
    v.style.backgroundImage=`linear-gradient(rgba(0,0,0,.58),rgba(0,0,0,.65)),url("${bg3}")`;
    v.style.backgroundPosition='center';
    $('#location').textContent='OFFICE';
  }else if(side==='left'){
    v.style.backgroundImage=`linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.72)),url("${bg1}")`;
    v.style.backgroundPosition='left center';
    $('#location').textContent=leftDoor?'LEFT DOOR - CLOSED':'LEFT HALL';
  }else{
    v.style.backgroundImage=`linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.72)),url("${fg1}")`;
    v.style.backgroundPosition='right center';
    $('#location').textContent=rightDoor?'RIGHT DOOR - CLOSED':'RIGHT HALL';
  }

  const sg=$('#sceneGuy');sg.style.display='none';
  if(side==='left' && guy===6 && leftLight && !leftDoor){
    sg.style.display='block';sg.style.left='35px';sg.style.right='auto';sg.style.bottom='5px';sg.style.width='165px';
  }
  if(side==='right' && guy===7 && rightLight && !rightDoor){
    sg.style.display='block';sg.style.right='35px';sg.style.left='auto';sg.style.bottom='5px';sg.style.width='165px';
  }
  v.style.filter=(leftLight&&side==='left')||(rightLight&&side==='right')?'brightness(.88) contrast(1.15)':'brightness(.52) contrast(1.18)';
}
function renderCam(){
  const c=CAMS[cam];
  $('#camPic').style.backgroundImage=`url("${c.b}")`;
  $('#camName').textContent=c.n;
  $$('.cam').forEach((b,i)=>b.classList.toggle('active',i===cam));
  const cg=$('#camGuy');cg.classList.toggle('show',guy===cam);
  const pos=[['57%','29px',110],['17%','24px',130],['70%','-8px',155],['42%','40px',115],['74%','-5px',165],['23%','-5px',165]][cam];
  cg.style.left=pos[0];cg.style.bottom=pos[1];cg.style.width=pos[2]+'px';
}
function update(){
  let h=Math.min(6,Math.floor(t/(duration/6)));
  $('#clock').textContent=(h===0?'12':h)+' AM';
  $('#power').textContent='POWER: '+Math.ceil(power)+'%';
}
function moveGuy(hour){
  if(guy>=6)return;
  const r=Math.random();
  if(r<.69+hour*.035) guy=Math.min(5,guy+1);
  else if(r<.85) guy=Math.max(0,guy-1);
  else guy=Math.floor(Math.random()*6);
  if(guy===5)guy=Math.random()<.5?6:7;
  if(camOpen && guy===cam){tinyGlitch();if(hour>=3&&Math.random()<.25)note('he saw you')}
  renderCam();renderOffice();
}
function setButton(el,on){$(el).classList.toggle('on',on)}
function toggleCam(){
  if(!running||blackout)return;
  camOpen=!camOpen;$('#camOverlay').classList.toggle('open',camOpen);
  $('#cams').classList.toggle('on',camOpen);
  if(camOpen){renderCam();flash('#blackFlash',.55);tinyGlitch()}
}
$('#cams').onclick=toggleCam;
$('#leftDoor').onclick=()=>{if(!running||blackout)return;leftDoor=!leftDoor;setButton('#leftDoor',leftDoor);renderOffice()};
$('#rightDoor').onclick=()=>{if(!running||blackout)return;rightDoor=!rightDoor;setButton('#rightDoor',rightDoor);renderOffice()};
$('#leftLight').onclick=()=>{if(!running||blackout)return;leftLight=!leftLight;setButton('#leftLight',leftLight);renderOffice()};
$('#rightLight').onclick=()=>{if(!running||blackout)return;rightLight=!rightLight;setButton('#rightLight',rightLight);renderOffice()};
$$('.cam').forEach((b,i)=>b.onclick=()=>{cam=i;renderCam();tinyGlitch()});
$('#leftZone').onmouseenter=()=>{look=-1;renderOffice()};
$('#leftZone').onmouseleave=()=>{look=0;renderOffice()};
$('#rightZone').onmouseenter=()=>{look=1;renderOffice()};
$('#rightZone').onmouseleave=()=>{look=0;renderOffice()};

function blackoutStart(){
  blackout=true;camOpen=false;$('#camOverlay').classList.remove('open');
  $$('.control').forEach(x=>x.classList.remove('on'));
  leftDoor=rightDoor=leftLight=rightLight=false;
  $('#view').style.filter='brightness(.06)';
  $('#location').textContent='...';
  note('power out',1600);
  setTimeout(()=>{if(running){guy=Math.random()<.5?6:7;doorTimer=99}},2100);
}
function lose(){
  running=false;amb.pause();
  winSound.currentTime=0;winSound.play().catch(()=>{});
  $('#jumpscare').classList.add('show');
  setTimeout(()=>{
    $('#jumpscare').classList.remove('show');
    $('#endTitle').textContent='YOU GOT FIRED';
    $('#endText').textContent='he already works here. somehow.';
    $('#ending').classList.add('show');
  },1450)
}
function win(){
  running=false;amb.pause();localStorage.setItem('brooklynNightShiftWon','true');
  flash('#whiteFlash',.35);note('6 AM',1000);
  setTimeout(()=>{
    $('#endTitle').textContent='6 AM';
    $('#endText').textContent='nice.';
    $('#ending').classList.add('show');
  },1050)
}
function loop(now){
  if(!running)return;
  let dt=Math.min(.05,(now-last)/1000||0);last=now;t+=dt;
  const hour=Math.min(6,Math.floor(t/(duration/6)));
  let drain=.10+(camOpen?.12:0)+(leftDoor?.20:0)+(rightDoor?.20:0)+(leftLight?.12:0)+(rightLight?.12:0);
  power=Math.max(0,power-drain*dt*1.65);
  if(power<=0&&!blackout)blackoutStart();

  moveTimer+=dt;
  if(!blackout&&moveTimer>Math.max(2.5,6.8-hour*.55+Math.random()*2)){
    moveTimer=0;moveGuy(hour);
  }
  if(guy===6||guy===7){
    doorTimer+=dt;
    const closed=guy===6?leftDoor:rightDoor;
    if(closed&&doorTimer>1.6){
      guy=Math.random()<.5?2:3;doorTimer=0;tinyGlitch();renderCam();renderOffice();
    }else if(!closed&&doorTimer>(hour>=4?2.8:4.1)){lose();return}
  }else doorTimer=0;

  if(hour>=3 && Math.random()<dt*.015){tinyGlitch();flash('#blackFlash',.25)}
  if(hour>=4 && Math.random()<dt*.006)note(['wrong room','dont answer it','he has another job','you missed him'][Math.floor(Math.random()*4)],1000);
  if(t>=duration){win();return}
  update();requestAnimationFrame(loop)
}
function begin(){
  start.classList.add('hidden');shift.classList.remove('hidden');
  $('#ending').classList.remove('show');
  running=true;t=0;power=100;guy=0;moveTimer=0;doorTimer=0;blackout=false;
  camOpen=false;leftDoor=rightDoor=leftLight=rightLight=false;look=0;
  $$('.control').forEach(x=>x.classList.remove('on'));
  renderOffice();renderCam();update();
  amb.currentTime=0;amb.volume=.5;amb.play().catch(()=>{});
  note('12 AM',1000);last=performance.now();requestAnimationFrame(loop)
}
$('#play').onclick=begin;
$('#retry').onclick=begin;

setTimeout(()=>{if(!running&&Math.random()<.7)outerNote('another job?')},6500);
setTimeout(()=>{if(!running&&Math.random()<.35){$('#speech').textContent='dont clock in';tinyGlitch()}},10000);

fetch('https://ryan.destroygames.com/global/header.html')
 .then(r=>r.ok?r.text():Promise.reject())
 .then(h=>$('#header-container').innerHTML=h).catch(()=>{});
</script>
</body>
</html>
