<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Jerry's Crap Shack™</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
*{box-sizing:border-box}
#locked{display:none;position:fixed;inset:0;background:#000;align-items:center;justify-content:center}
#locked img{max-width:96vw;max-height:96vh;object-fit:contain}
#shop{display:none;position:fixed;inset:0;background:#000}
#stage{
  position:absolute;
  left:50%;top:50%;
  width:min(100vw,calc(100vh * 1.6551724138));
  aspect-ratio:960/580;
  transform:translate(-50%,-50%);
  background:url("assets/store_clip_reference.webp") center/100% 100% no-repeat;
  overflow:hidden;
}

/* Click regions measured directly from the supplied YouTube clip frame. */
.slot{
  position:absolute;
  cursor:pointer;
  border-radius:5.5%;
  border:0 solid transparent;
  transition:box-shadow .12s,filter .12s,transform .12s;
}
.slot:hover{
  box-shadow:0 0 24px 8px rgba(255,235,235,.62) inset,0 0 15px rgba(255,255,255,.45);
  filter:brightness(1.09);
  transform:scale(1.01);
}
.slot.sold::after{
  content:"SOLD OUT!";
  position:absolute;
  inset:25% 3%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;
  background:#b50000e8;
  border:4px solid #fff;
  font:900 clamp(12px,2.4vw,32px) Impact,Arial,sans-serif;
  letter-spacing:1px;
  transform:rotate(-11deg);
  text-shadow:2px 2px #500;
}
.slot .tip{
  position:absolute;left:50%;bottom:-29px;transform:translateX(-50%);
  color:#fff;background:#111d;border:1px solid #aaa;padding:4px 7px;
  font:11px Arial;white-space:nowrap;display:none;z-index:20;
}
.slot:hover .tip{display:block}

#s0{left:5.45%;top:14.2%;width:16.95%;height:22.4%}
#s1{left:25.0%;top:14.2%;width:16.75%;height:22.4%}
#s2{left:44.65%;top:14.2%;width:16.9%;height:22.4%}
#s3{left:5.45%;top:41.0%;width:16.95%;height:22.3%}
#s4{left:25.0%;top:41.0%;width:16.75%;height:22.3%}
#s5{left:44.65%;top:41.0%;width:16.9%;height:22.3%}

#notice{
  display:none;position:absolute;right:2%;bottom:2%;
  background:#111e;color:#fff;border:1px solid #aaa;
  padding:8px 12px;font:12px Consolas;z-index:30
}
#dev{
  display:none;position:absolute;left:8px;bottom:8px;z-index:40;
  gap:5px
}
#dev button{font:11px Arial;padding:5px 7px}
</style>
</head>
<body>
<div id="locked">
  <img src="assets/THE'RE_RUNNING_OUT_OF_YOU!.webp" alt="The Jerk Store Called">
</div>

<div id="shop">
 <div id="stage">
   <div class="slot" id="s0" data-key="dog"><span class="tip">Dog</span></div>
   <div class="slot" id="s1" data-key="camera"><span class="tip">JVC Camera</span></div>
   <div class="slot" id="s2" data-key="charleyyy"><span class="tip">Charleyyy and Friends</span></div>
   <div class="slot" id="s3" data-key="borat"><span class="tip">Borat Jeffy Card Pack</span></div>
   <div class="slot" id="s4" data-key="piano"><span class="tip">Jerry's Crap Piano</span></div>
   <div class="slot" id="s5" data-key="marvin"><span class="tip">Marvin Doll</span></div>
   <div id="notice"></div><div id="ver" style="display:none;position:absolute;right:8px;top:8px;background:#000c;color:#0f0;font:11px Consolas;padding:4px;z-index:99">V5 CLIP MATCH</div>
   <div id="dev">
      <button onclick="toggleEnding()">toggle ending</button>
      <button onclick="resetStore()">reset purchases</button>
   </div>
 </div>
</div>

<audio id="music" src="assets/SMLWiki.com - jeffymart (Store Jerry's Crap-Shack).mp3" loop></audio>

<script>
const endingKeys=["endingA","endingB","endingab","EndingA","EndingB"];
const unlocked=endingKeys.some(k=>localStorage.getItem(k)==="true") ||
               new URLSearchParams(location.search).get("unlocked")==="1";

document.getElementById("locked").style.display=unlocked?"none":"flex";
document.getElementById("shop").style.display=unlocked?"block":"none";

if(new URLSearchParams(location.search).get("admin")==="1"){ document.getElementById("ver").style.display="block";
  document.getElementById("dev").style.display="flex";
}

const itemNames={
  dog:"Dog",
  camera:"JVC Camera",
  charleyyy:"Charleyyy and Friends: The Video Game",
  borat:"Borat Jeffy Card Pack",
  piano:"Jerry's Crap Piano",
  marvin:"Marvin Doll"
};

document.querySelectorAll(".slot").forEach(el=>{
  const key=el.dataset.key;
  if(localStorage.getItem("store_"+key)==="sold") el.classList.add("sold");
  el.addEventListener("click",()=>buy(el,key));
});

function buy(el,key){
  if(el.classList.contains("sold")) return;
  localStorage.setItem("store_"+key,"sold");
  el.classList.add("sold");

  // Preserve hooks used by the reconstructed archive.
  if(key==="marvin") localStorage.setItem("marvinDoll","true");
  if(key==="piano") localStorage.setItem("crapPiano","true");
  if(key==="camera") localStorage.setItem("camera","true");

  toast(itemNames[key]+" purchased");
}

function toast(text){
  const n=document.getElementById("notice");
  n.textContent=text;n.style.display="block";
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>n.style.display="none",1700);
}

// Browsers require one user interaction before autoplaying audio.
if(unlocked){
  const music=document.getElementById("music");
  const startMusic=()=>{
    music.volume=.5;
    music.play().catch(()=>{});
    document.removeEventListener("pointerdown",startMusic);
    document.removeEventListener("keydown",startMusic);
  };
  document.addEventListener("pointerdown",startMusic);
  document.addEventListener("keydown",startMusic);
}

function toggleEnding(){
  localStorage.setItem("endingA",localStorage.getItem("endingA")==="true"?"false":"true");
  location.reload();
}
function resetStore(){
  if(!confirm("Reset Jerry's Crap Shack purchases?")) return;
  ["dog","camera","charleyyy","borat","piano","marvin"].forEach(k=>localStorage.removeItem("store_"+k));
  ["marvinDoll","crapPiano","camera"].forEach(k=>localStorage.removeItem(k));
  location.reload();
}
</script>
</body>
</html>
