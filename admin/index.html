<!doctype html><html><head><meta charset="utf-8"><title>SMLWiki Admin Login</title>
<style>html,body{height:100%;margin:0;background:#050606;color:#ddd;font-family:Consolas,monospace}body{display:grid;place-items:center}.box{width:min(430px,90vw);background:#111;border:1px solid #344;padding:25px;border-radius:9px}h1{color:#66ff98}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;background:#080a0a;color:#fff;border:1px solid #455;border-radius:6px}button{cursor:pointer;color:#bfffd4}#err{color:#ff7070;height:18px;margin-top:10px}</style></head>
<body><div class="box"><h1>SMLWIKI // ADMIN</h1><div>AUTHORIZED ACCESS ONLY</div><form id="f"><input id="p" type="password" placeholder="Password" autofocus><button>ENTER ADMIN PANEL</button><div id="err"></div></form></div>
<script>
const REQUIRED_PASSWORD="youwontguessthispassword12312";
f.onsubmit=e=>{e.preventDefault();if(p.value===REQUIRED_PASSWORD){sessionStorage.setItem("smlwiki_admin_authenticated","yes");location.href="./panel.html"}else{err.textContent="ACCESS DENIED";p.value="";p.focus()}};
</script></body></html>
